name: EarTrumpet-DragDrop-Build

# 手动触发，也可以在 push 时触发
on:
  workflow_dispatch:
  push:
    branches: [ master, dragdrop ]

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x86

jobs:
  build:
    runs-on: windows-2019
    steps:
      - name: Checkout（完整历史，GitVersion 需要全部提交和标签）
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 应用拖拽功能补丁
        shell: pwsh
        run: git apply eartrumpet-dragdrop.patch

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.15
        with:
          versionSpec: "5.x"

      - name: Use GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.15

      - name: Install NuGet
        uses: NuGet/setup-nuget@v1
        with:
          nuget-version: latest

      - name: Restore NuGet Packages
        run: nuget restore EarTrumpet.vs15.sln

      - name: 创建自签名证书（用于本地安装签名）
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=EarTrumpetDragDrop, O=LocalBuild" `
            -KeyUsage DigitalSignature `
            -FriendlyName "EarTrumpet DragDrop Build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -NotAfter (Get-Date).AddYears(5)
          Write-Output "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: 修改包身份（避免与官方 EarTrumpet 冲突）
        shell: pwsh
        run: |
          $manifestPath = ".\EarTrumpet.Package\Package.appxmanifest"
          $manifest = [xml](Get-Content $manifestPath)
          $manifest.Package.Identity.Name = "LocalBuild.EarTrumpetDragDrop"
          $manifest.Package.Identity.Publisher = "CN=EarTrumpetDragDrop, O=LocalBuild"
          $manifest.Package.Properties.DisplayName = "EarTrumpet DragDrop"
          $manifest.Package.Applications.Application.VisualElements.DisplayName = "EarTrumpet DragDrop"
          $manifest.Save($manifestPath)

          $assocPath = ".\EarTrumpet.Package\Package.StoreAssociation.xml"
          $assoc = [xml](Get-Content $assocPath)
          $assoc.StoreAssociation.Publisher = "CN=EarTrumpetDragDrop, O=LocalBuild"
          $assoc.Save($assocPath)

          # Bugsnag 占位符替换为空 key，避免上报
          $cfg = Get-Content ".\EarTrumpet\app.config"
          $cfg | ForEach-Object { $_.Replace("{bugsnag.apikey}", "0000000000") } | Set-Content ".\EarTrumpet\app.config"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: 编译 MSIX 安装包（旁加载模式，含签名）
        shell: cmd
        run: >
          msbuild EarTrumpet.Package/EarTrumpet.Package.wapproj
          /p:Platform=%BUILD_PLATFORM% /p:Configuration=%BUILD_CONFIGURATION%
          /p:AppxBundle=Always /p:Channel=AppInstaller
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageDir=${{ github.workspace }}\output\
          -maxcpucount

      - name: 导出证书（安装包前需要先信任它）
        shell: pwsh
        run: |
          $cert = Get-ChildItem "Cert:\CurrentUser\My" | Where-Object { $_.Thumbprint -eq "${{ steps.cert.outputs.thumbprint }}" }
          $pwd = ConvertTo-SecureString -String "eartrumpet123" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "${{ github.workspace }}\output\EarTrumpetDragDrop.cer.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "${{ github.workspace }}\output\EarTrumpetDragDrop.cer" -Type CERT

      - name: 上传编译结果
        uses: actions/upload-artifact@v3
        with:
          name: EarTrumpet-DragDrop-安装包
          path: |
            output/*.msixbundle
            output/*.cer
            output/*.appinstaller
